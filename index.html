<noscript><p>Для локальной расшифровки включите JavaScript.</p></noscript>
</main>
<script>const form = document.querySelector("#unlock");
const input = document.querySelector("#access-key");
const error = document.querySelector("#error");
const payload = document.querySelector("#payload");
const submit = document.querySelector("#submit");

function decode(value) {
  return Uint8Array.from(atob(value.replace(/-/g, "+").replace(/_/g, "/")), char => char.charCodeAt(0));
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  error.hidden = true;
  submit.disabled = true;

  let html;
  try {
    const value = input.value.trim();
    if (!/^[A-Za-z0-9_-]{43}$/.test(value)) throw new Error("Invalid key");
    const key = await crypto.subtle.importKey("raw", decode(value), "AES-GCM", false, ["decrypt"]);
    const bytes = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: decode(payload.dataset.iv) },
      key,
      decode(payload.dataset.content),
    );
    html = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
  } catch {
    error.hidden = false;
    submit.disabled = false;
    input.focus();
    return;
  }

  input.value = "";
  document.open();
  document.write(html);
  document.close();
});
</script>
